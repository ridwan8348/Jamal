<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Typer</title>
<style>
  :root {
    --bg: #f0f1f5;
    --panel: #ffffff;
    --panel-border: #d9dce6;
    --text: #2b2f3d;
    --dim: #8a90a5;
    --accent: #3d59a1;
    --correct: #4c7a2e;
    --wrong: #c0394f;
    --wrong-bg: rgba(192, 57, 79, 0.14);
    --caret: #3d59a1;
    --overlay: rgba(240, 241, 245, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel-border: #2a2e3d;
      --text: #e8eaf0;
      --dim: #6b7185;
      --accent: #7aa2f7;
      --correct: #9ece6a;
      --wrong: #f7768e;
      --wrong-bg: rgba(247, 118, 142, 0.18);
      --caret: #7aa2f7;
      --overlay: rgba(15, 17, 23, 0.82);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel-border: #2a2e3d;
    --text: #e8eaf0;
    --dim: #6b7185;
    --accent: #7aa2f7;
    --correct: #9ece6a;
    --wrong: #f7768e;
    --wrong-bg: rgba(247, 118, 142, 0.18);
    --caret: #7aa2f7;
    --overlay: rgba(15, 17, 23, 0.82);
  }
  :root[data-theme="light"] {
    --bg: #f0f1f5;
    --panel: #ffffff;
    --panel-border: #d9dce6;
    --text: #2b2f3d;
    --dim: #8a90a5;
    --accent: #3d59a1;
    --correct: #4c7a2e;
    --wrong: #c0394f;
    --wrong-bg: rgba(192, 57, 79, 0.14);
    --caret: #3d59a1;
    --overlay: rgba(240, 241, 245, 0.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 1.5rem;
  }
  .stats {
    display: flex;
    gap: 2.5rem;
    margin-bottom: 1.5rem;
  }
  .stat { text-align: center; }
  .stat .value {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .stat .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin-top: 0.2rem;
  }
  #board {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 800px;
    width: 100%;
    font-size: 1.35rem;
    line-height: 2.2rem;
    letter-spacing: 0.02em;
    cursor: text;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  #board.focused { box-shadow: 0 0 0 2px var(--accent); }
  #board.blurred::after {
    content: "Click here or press any key to start typing";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--overlay);
    backdrop-filter: blur(3px);
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    text-align: center;
    padding: 1rem;
  }
  @media (hover: none) and (pointer: coarse) {
    #board.blurred::after { content: "Tap here to start typing"; }
  }
  #ghost {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: none;
    padding: 0;
    font-size: 16px; /* >=16px stops iOS from zooming in on focus */
  }
  #text {
    position: relative;
    max-height: calc(2.2rem * 4); /* 4 lines; current line auto-scrolls into view */
    overflow-y: hidden;
  }
  #text span { color: var(--dim); border-radius: 3px; }
  #text span.correct { color: var(--correct); }
  #text span.wrong { color: var(--wrong); background: var(--wrong-bg); }
  #text span.current {
    background: var(--caret);
    color: var(--bg);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { background: transparent; color: var(--dim); } }
  @media (prefers-reduced-motion: reduce) {
    #text span.current { animation: none; }
  }
  .controls {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
    align-items: center;
  }
  button, select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.6rem 1.2rem;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #result {
    margin-top: 1.5rem;
    text-align: center;
    min-height: 3rem;
  }
  #result .headline {
    font-size: 1.3rem;
    color: var(--correct);
    font-weight: 700;
  }
  #result .sub { color: var(--dim); font-size: 0.9rem; margin-top: 0.3rem; }
  .hint { color: var(--dim); font-size: 0.75rem; margin-top: 1rem; text-align: center; }
  kbd {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
    font-size: 0.75rem;
  }
  @media (max-width: 600px) {
    body { padding: 1rem 0.75rem; justify-content: flex-start; }
    h1 { font-size: 1.1rem; margin-bottom: 1rem; }
    .stats { gap: 1.5rem; margin-bottom: 1rem; }
    .stat .value { font-size: 1.7rem; }
    #board { padding: 1.1rem; font-size: 1.05rem; line-height: 1.8rem; }
    #text { max-height: calc(1.8rem * 4); }
    .hint kbd { display: none; }
    .hint .desktop-only { display: none; }
  }
</style>
</head>
<body>

<h1>⌨ SPEED TYPER</h1>

<div class="stats">
  <div class="stat"><div class="value" id="wpm">0</div><div class="label">WPM</div></div>
  <div class="stat"><div class="value" id="accuracy">100%</div><div class="label">Accuracy</div></div>
  <div class="stat"><div class="value" id="timer">60</div><div class="label">Seconds</div></div>
</div>

<div id="board" class="blurred">
  <input id="ghost" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Type here">
  <div id="text"></div>
</div>

<div class="controls">
  <select id="duration">
    <option value="15">15s</option>
    <option value="30">30s</option>
    <option value="60" selected>60s</option>
    <option value="120">120s</option>
  </select>
  <button id="restart">Restart</button>
</div>

<div id="result"></div>
<div class="hint"><span class="desktop-only">Press <kbd>Tab</kbd> or click Restart for a new round. </span>Best WPM this session: <span id="best">—</span></div>

<script>
(() => {
  const WORDS = (
    "the quick brown fox jumps over lazy dog and runs through green fields " +
    "time people way water long little world own place right small large " +
    "great hand life work part child eye woman number point home read need " +
    "land different move try kind picture again change play spell air away " +
    "animal house letter mother answer found study still learn should world " +
    "high every near add food between below country plant last school father " +
    "keep tree never start city earth thought head under story example begin " +
    "paper group always music those both mark often until mile river car feet " +
    "care second book carry took science eat room friend began idea fish " +
    "mountain stop once base hear horse cut sure watch color face wood main " +
    "open seem together next white children got walk sea grow river four " +
    "state hard early light real light almost above girl sometimes young " +
    "talk soon list song being leave family body music color question"
  ).split(/\s+/);

  const textEl = document.getElementById("text");
  const boardEl = document.getElementById("board");
  const ghost = document.getElementById("ghost");
  const wpmEl = document.getElementById("wpm");
  const accEl = document.getElementById("accuracy");
  const timerEl = document.getElementById("timer");
  const resultEl = document.getElementById("result");
  const restartBtn = document.getElementById("restart");
  const durationSel = document.getElementById("duration");
  const bestEl = document.getElementById("best");

  // The ghost input always holds one sentinel char so that Backspace on
  // mobile keyboards (which often report key "Unidentified") still
  // produces a deletion we can observe via the input event.
  const SENTINEL = "​";

  let chars = [];        // span elements
  let target = "";       // the full text to type
  let pos = 0;           // current index into target
  let typedTotal = 0;    // total keystrokes (excluding backspace)
  let typedCorrect = 0;  // correct keystrokes
  let startTime = null;
  let duration = 60;
  let timeLeft = 60;
  let tick = null;
  let finished = false;
  let bestWpm = 0;

  function armGhost() {
    ghost.value = SENTINEL;
    try { ghost.setSelectionRange(1, 1); } catch (_) {}
  }

  function generateText(wordCount) {
    const out = [];
    for (let i = 0; i < wordCount; i++) {
      out.push(WORDS[Math.floor(Math.random() * WORDS.length)]);
    }
    return out.join(" ");
  }

  function render() {
    textEl.innerHTML = "";
    chars = [];
    for (const ch of target) {
      const span = document.createElement("span");
      span.textContent = ch;
      textEl.appendChild(span);
      chars.push(span);
    }
    if (chars.length) chars[0].classList.add("current");
  }

  function reset() {
    clearInterval(tick);
    tick = null;
    duration = parseInt(durationSel.value, 10);
    timeLeft = duration;
    pos = 0;
    typedTotal = 0;
    typedCorrect = 0;
    startTime = null;
    finished = false;
    // Enough words that a fast typist won't run out (~250 wpm ceiling)
    target = generateText(Math.max(50, Math.ceil(duration * 5)));
    render();
    wpmEl.textContent = "0";
    accEl.textContent = "100%";
    timerEl.textContent = timeLeft;
    resultEl.innerHTML = "";
    armGhost();
    ghost.focus({ preventScroll: true });
  }

  function currentWpm() {
    if (!startTime) return 0;
    const minutes = (Date.now() - startTime) / 60000;
    if (minutes <= 0) return 0;
    // Standard WPM: correct characters / 5 per minute
    return Math.round((typedCorrect / 5) / minutes);
  }

  function updateStats() {
    wpmEl.textContent = currentWpm();
    accEl.textContent = typedTotal === 0
      ? "100%"
      : Math.round((typedCorrect / typedTotal) * 100) + "%";
  }

  function startTimer() {
    startTime = Date.now();
    tick = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;
      updateStats();
      if (timeLeft <= 0) finish();
    }, 1000);
  }

  function finish() {
    clearInterval(tick);
    tick = null;
    finished = true;
    const wpm = currentWpm();
    const acc = typedTotal === 0 ? 100 : Math.round((typedCorrect / typedTotal) * 100);
    if (wpm > bestWpm) {
      bestWpm = wpm;
      bestEl.textContent = bestWpm + " WPM";
    }
    resultEl.innerHTML =
      '<div class="headline">' + wpm + " WPM</div>" +
      '<div class="sub">' + acc + "% accuracy · " + typedCorrect +
      " correct / " + typedTotal + " typed characters</div>";
  }

  function handleBackspace() {
    if (finished) return;
    if (pos > 0) {
      chars[pos].classList.remove("current");
      pos--;
      chars[pos].classList.remove("correct", "wrong");
      chars[pos].classList.add("current");
      scrollCurrentIntoView();
    }
  }

  function handleChar(key) {
    if (finished) return;
    if (!startTime) startTimer();

    typedTotal++;
    if (key === target[pos]) {
      typedCorrect++;
      chars[pos].classList.add("correct");
    } else {
      chars[pos].classList.add("wrong");
    }
    chars[pos].classList.remove("current");
    pos++;

    if (pos >= target.length) { finish(); return; }
    chars[pos].classList.add("current");
    scrollCurrentIntoView();
    updateStats();
  }

  // Scroll only the text container (never the page) so the stats bar
  // stays on screen; keeps the current line as the second visible line.
  function scrollCurrentIntoView() {
    const cur = chars[pos];
    const lineHeight = parseFloat(getComputedStyle(textEl).lineHeight) || 32;
    textEl.scrollTop = Math.max(0, cur.offsetTop - lineHeight);
  }

  // Desktop path: real key values arrive via keydown. preventDefault stops
  // the input event below from double-counting the same keystroke.
  ghost.addEventListener("keydown", (e) => {
    if (e.key === "Tab") { e.preventDefault(); reset(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Backspace") {
      e.preventDefault();
      handleBackspace();
      return;
    }
    if (e.key.length === 1) {
      e.preventDefault();
      handleChar(e.key);
    }
  });

  // Mobile path: virtual keyboards often report key "Unidentified", so we
  // diff the ghost input's value against the sentinel after each edit.
  ghost.addEventListener("input", () => {
    const v = ghost.value;
    if (v.length < SENTINEL.length) {
      handleBackspace();
    } else if (v.length > SENTINEL.length) {
      const typed = v.startsWith(SENTINEL) ? v.slice(SENTINEL.length) : v;
      for (const ch of typed) {
        if (ch === SENTINEL) continue;
        handleChar(ch);
      }
    }
    armGhost();
  });

  boardEl.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    ghost.focus({ preventScroll: true });
  });
  ghost.addEventListener("focus", () => {
    boardEl.classList.remove("blurred");
    boardEl.classList.add("focused");
    armGhost();
  });
  ghost.addEventListener("blur", () => {
    boardEl.classList.add("blurred");
    boardEl.classList.remove("focused");
  });
  restartBtn.addEventListener("click", reset);
  durationSel.addEventListener("change", reset);

  reset();
})();
</script>

</body>
</html>
